version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
      interval: "weekly"
- package-ecosystem: "npm"
  directory: "/"
  schedule:
      interval: "weekly"
  # Build tools also need security updates: the bundle visualizer runs a local
  # report server. Meteor 3.6 now uses Rspack 2, so the old blanket exclusions
  # no longer apply. Review toolchain compatibility when merging updates.
# Playwright end-to-end test harness — pure test-only tooling that never ships in
# WeKan. It now depends only on @playwright/test and the official `mongodb` driver
# (the heavy, CVE-prone `mongosh` CLI was replaced by helpers/mongo-runner.js).
# Watch this directory so those two stay patched.
- package-ecosystem: "npm"
  directory: "/tests/playwright"
  schedule:
      interval: "weekly"
