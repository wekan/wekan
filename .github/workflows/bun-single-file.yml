name: Bun single-file WeKan

# One executable per Bun platform (docs/Platforms/Single-File.md, "Bun single
# files"): that platform's published Bun bundle ZIP, unchanged, inside its own
# Bun, made by releases/single-file/bun/build.mjs. Each one is built ON its
# platform with the bundle's own bun - Alpine for musl, as bun.yml does - so
# nothing is cross-compiled and the runtime is the one the bundle was tested
# with. A target whose Bun bundle the release does not have is SKIPPED, not
# failed. FreeBSD and Android are not built: GitHub has no runner for them,
# and their bundles are used unpacked.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing WeKan release tag (empty = latest published release)'
        type: string
        required: false
      publish:
        description: 'Attach the single files and checksums to that release'
        type: boolean
        default: true
      only:
        description: 'JSON target list, e.g. ["linux-x64"] (empty = all)'
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: true
      only:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: wekan-bun-single-file-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          tag="${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          matrix="$(python3 -c '
          import json, os
          targets = [t for t in json.load(open("releases/bun/targets.json"))
                     if t["kind"] in ("native", "musl")]
          only = json.loads(os.environ.get("ONLY") or "[]")
          if only:
              targets = [t for t in targets if t["target"] in only]
          print(json.dumps({"include": targets}))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Release $tag; targets: $matrix"

  build:
    needs: plan
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.tag }}

      - name: Fetch and verify ${{ matrix.target }}'s published Bun bundle
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          zip="wekan-${version}-bun-${TARGET}.zip"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$zip" --pattern "$zip.sha256sum" || [ ! -f "$zip" ]; then
            echo "::notice::$TARGET: $TAG has no $zip; skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -f "$zip.sha256sum" ] || { echo "::error::$zip has no published .sha256sum; a single file is never built from an unverified bundle."; exit 1; }
          # A .sha256sum written on Windows before releases/bun/assets.py wrote LF
          # (v12.44 windows-arm64) ends in CRLF; the line is the same without it.
          tr -d '\r' < "$zip.sha256sum" > "$zip.sha256sum.lf" && mv "$zip.sha256sum.lf" "$zip.sha256sum"
          if command -v sha256sum >/dev/null; then sha256sum -c "$zip.sha256sum"; else shasum -a 256 -c "$zip.sha256sum"; fi
          # Only the bundle's own Bun, to build with - the ZIP itself is
          # embedded as it is.
          case "$TARGET" in windows-*) bun=bun.exe ext=.exe ;; *) bun=bun ext= ;; esac
          unzip -q -j "$zip" "bundle/$bun" -d builder
          chmod +x "builder/$bun"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "bun=builder/$bun" >> "$GITHUB_OUTPUT"
          echo "out=wekan-${version}-bun-${TARGET}-single-file${ext}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and start it (Linux, macOS, Windows)
        if: steps.fetch.outputs.skip != 'true' && matrix.kind == 'native'
        env:
          ZIP: ${{ steps.fetch.outputs.zip }}
          BUN: ${{ steps.fetch.outputs.bun }}
          OUT: ${{ steps.fetch.outputs.out }}
          VERSION: ${{ steps.fetch.outputs.version }}
        run: bash releases/single-file/bun/build-and-check.sh

      - name: Build and start it (musl, in Alpine)
        if: steps.fetch.outputs.skip != 'true' && matrix.kind == 'musl'
        env:
          ZIP: ${{ steps.fetch.outputs.zip }}
          BUN: ${{ steps.fetch.outputs.bun }}
          OUT: ${{ steps.fetch.outputs.out }}
          VERSION: ${{ steps.fetch.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e ZIP -e BUN -e OUT -e VERSION -e TARGET \
            alpine:3.23 sh -ec 'apk add --no-cache bash coreutils libstdc++ libgcc && bash releases/single-file/bun/build-and-check.sh'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fetch.outputs.skip != 'true'
        with:
          name: bun-single-file-${{ matrix.target }}
          path: wekan-*-bun-${{ matrix.target }}-single-file*
          retention-days: 3
          compression-level: 0

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bun-single-file-*
          path: artifacts
      - name: Attach every Bun single file that was built and started
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=0
          for f in artifacts/bun-single-file-*/wekan-*-single-file*; do
            case "$f" in *.sha256sum) continue ;; esac
            (cd "$(dirname "$f")" && sha256sum -c "$(basename "$f").sha256sum")
            bash releases/github-release-upload.sh "$GITHUB_REPOSITORY" "$TAG" "$f" "$f.sha256sum"
            published=$((published + 1))
          done
          echo "Published $published Bun single files to $TAG."
