name: AppImage

# Build WeKan as an AppImage for every CPU an AppImage runtime exists for, and
# attach them to a WeKan release. The ordinary full-release path calls this
# workflow from release-all.yml with the exact tag after its core bundles are
# published; workflow_dispatch remains available for rebuilding an AppImage.
#
# WHAT IS INSIDE IS WHAT WEKAN ALREADY SHIPS. release-all.yml already produces a
# bundle that runs offline with nothing installed: the Meteor server (main.js),
# the bundled Node.js the release was built against, the wekan/FerretDB v1 fork
# with its embedded pure-Go SQLite backend, the wekan/mongo-tools-patches binaries, the
# cpu-exec/qemu-user shim from #6458, and start-wekan.sh to bring them up. That
# bundle is already relocatable and already self-contained - it is the offline
# zip people download today - so this workflow does NOT rebuild WeKan. It takes
# the wekan-<version>-<arch>.zip off the release and wraps it, which means the
# AppImage is byte-for-byte the same server, Node and FerretDB as the zip beside
# it rather than a second build that might differ.
#
# So there is no MongoDB to install, no Node to install, and no database server
# to run: FerretDB v1 keeps everything in SQLite files under the AppImage's data
# directory. One download, one file, double-click.
#
# WHICH CPUs. An AppImage needs a runtime binary for its architecture, and those
# exist for x86_64, aarch64, armhf and i686. WeKan publishes Linux bundles for
# amd64 and arm64, so those are the two that can be wrapped: x86_64 from amd64,
# aarch64 from arm64. Each is built on a runner of its own CPU, because
# appimagetool has to run on the architecture it is packing for. If a bundle for
# another architecture appears on a release, add it to the matrix and it will be
# wrapped the same way.
#
# WHERE THE DATA GOES. A .deb or a container has somewhere obvious to put its
# data; an AppImage is one file that may live on a USB stick, and the one place
# it can always write is the user's home. WRITABLE_PATH defaults to
# ~/.local/share/wekan here, so running the AppImage twice keeps the same boards,
# and setting WRITABLE_PATH yourself still overrides it - the launcher's own
# variables all still work.

on:
  # Callable, so release-all-missing.yml can ask for just the architectures
  # a release is short of. The build itself stays here - a second copy of the
  # appimages build would drift from this one.
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
      publish:
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these architectures, as a JSON array (e.g. ["aarch64"]); empty = all'
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to wrap and attach to (empty = newest release)'
        required: false
        type: string
      publish:
        description: 'Attach the AppImages to the release'
        required: false
        default: true
        type: boolean
      only:
        description: 'Only build these architectures, as a JSON array (e.g. ["aarch64"]); empty = all'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: wekan-appimage-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: find the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          # --repo on every gh call, whether or not the job happens to have
          # checked out: a call that relies on an inferred remote breaks the day
          # somebody removes the checkout, and the error it gives - "fatal: not
          # a git repository" - names neither gh nor the workflow.
          [ -n "$tag" ] || tag="$(gh release list --repo "${{ github.repository }}" \
            --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$tag" ]; then
            echo "::error::No release to wrap, and no tag was given."
            exit 1
          fi
          # The bundles are named wekan-10.57-amd64.zip against tag v10.57.
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Wrapping the bundles from $tag (version $version)"

  build:
    name: AppImage ${{ matrix.appimage_arch }}
    needs: release
    runs-on: ${{ matrix.runs_on }}
    # A 32-bit job that cannot run on the runner it was given must not fail the
    # release for the architectures that built fine.
    continue-on-error: ${{ matrix.tolerate_failure || false }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - appimage_arch: x86_64
            bundle_arch: amd64
            runs_on: ubuntu-24.04
          - appimage_arch: aarch64
            bundle_arch: arm64
            runs_on: ubuntu-24.04-arm
          # The other two architectures an AppImage runtime EXISTS for. There
          # are four in total - x86_64, aarch64, i686, armhf - and that is the
          # whole limit: the runtime is the ELF the kernel executes, so an
          # architecture with no runtime cannot have an AppImage at all. That is
          # why ppc64le, s390x, riscv64 and loong64 are not here and never will
          # be; they are served by the bundle zip and the .deb.
          #
          # i686 builds on the x86_64 runner, which runs 32-bit x86 natively -
          # no emulation, no multiarch, and appimagetool-i686 runs as-is.
          - appimage_arch: i686
            bundle_arch: i386
            runs_on: ubuntu-24.04
          # armhf builds on the aarch64 runner, which runs 32-bit ARM only if
          # the kernel was built with CONFIG_COMPAT and the 32-bit loader is
          # installed. GitHub does not promise either, so this one is allowed to
          # fail without taking the release with it - the same treatment TSC
          # gives its emulated armhf job. If it turns out to work reliably,
          # drop the flag; if it never does, drop the entry.
          - appimage_arch: armhf
            bundle_arch: armhf
            runs_on: ubuntu-24.04-arm
            tolerate_failure: true
    # WHICH entries this run wants, decided here because it cannot be decided
    # where it belongs. A job-level `if:` cannot see `matrix` - GitHub exposes
    # that context to runs-on, env, name, steps and a few others, but not to a
    # job's own condition - and a workflow that tries answers
    #   Unrecognized named-value: 'matrix'
    # and refuses to load at all, taking every workflow that CALLS it with it.
    # A job-level env CAN see matrix, so the answer is computed once here and
    # every step below asks for it.
    env:
      BUILD_THIS: ${{ inputs.only == '' || contains(fromJSON(inputs.only), matrix.appimage_arch) }}

    steps:
      - uses: actions/checkout@v7
        if: ${{ env.BUILD_THIS == 'true' }}

      # An AppImage only WRAPS an existing release bundle
      # (wekan-<version>-<arch>.zip); it cannot build one. When this workflow is
      # asked to fill a gap for a release whose base bundle is not published yet
      # (release in progress, or it failed), `gh release download` finds "no
      # assets to download" and the job failed hard. Turn that into a graceful
      # skip: if the bundle this arch needs is not on the release, flip BUILD_THIS
      # off so every step below (all gated on it) is skipped with a notice. The
      # AppImage is built normally once the base bundle exists.
      - name: Skip this arch if its release bundle is not published yet
        if: ${{ env.BUILD_THIS == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="wekan-${{ needs.release.outputs.version }}-${{ matrix.bundle_arch }}.zip"
          if gh release view --repo "${GITHUB_REPOSITORY:-wekan/wekan}" '${{ needs.release.outputs.tag }}' --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$zip"; then
            echo "OK: $zip is on ${{ needs.release.outputs.tag }}; building its AppImage."
          else
            echo "::notice::$zip is not on ${{ needs.release.outputs.tag }} yet - skipping this AppImage (it can only wrap a bundle that exists)."
            echo "BUILD_THIS=false" >> "$GITHUB_ENV"
          fi

      - name: Fetch the release bundle for this architecture
        if: ${{ env.BUILD_THIS == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="wekan-${{ needs.release.outputs.version }}-${{ matrix.bundle_arch }}.zip"
          gh release download '${{ needs.release.outputs.tag }}' \
            --repo "${{ github.repository }}" --pattern "$zip" --clobber
          unzip -q "$zip"
          # A zip that exists is not a bundle that runs; these are the two files
          # the AppImage is built around.
          for f in bundle/main.js bundle/node bundle/ferretdb bundle/start-wekan.sh; do
            if [ ! -e "$f" ]; then
              echo "::error::$zip has no $f - it is not a runnable WeKan bundle."
              exit 1
            fi
          done
          chmod +x bundle/node bundle/ferretdb bundle/start-wekan.sh
          du -sh bundle

      - name: Build the AppDir
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          arch='${{ matrix.appimage_arch }}'
          rm -rf AppDir
          mkdir -p AppDir/usr/lib/wekan AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a bundle AppDir/usr/lib/wekan/bundle

          # WeKan's own icon, from public/. 512x512 is what appimagetool wants
          # for the thumbnail a desktop shows.
          cp public/android-chrome-512x512.png \
             AppDir/usr/share/icons/hicolor/512x512/apps/wekan.png
          cp AppDir/usr/share/icons/hicolor/512x512/apps/wekan.png AppDir/wekan.png

          cat > AppDir/usr/share/applications/wekan.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=WeKan
          GenericName=Kanban board
          Comment=Open Source kanban board with FerretDB and Node.js included
          Exec=wekan
          Icon=wekan
          Terminal=true
          Categories=Office;ProjectManagement;
          Keywords=kanban;board;tasks;project;
          DESKTOP
          cp AppDir/usr/share/applications/wekan.desktop AppDir/wekan.desktop

          # AppRun is what the AppImage runs. It does three things the launcher
          # cannot do for itself: pick a writable place for the data (an AppImage
          # is read-only and may sit on a USB stick), say where WeKan is once it
          # has started, and then hand over to start-wekan.sh, which is the same
          # launcher the offline zip uses - so every variable it documents
          # (WRITABLE_PATH, PORT, ROOT_URL, MONGO_URL, WEKAN_DB, ...) still works.
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          set -eu
          HERE="$(dirname "$(readlink -f "$0")")"
          BUNDLE="$HERE/usr/lib/wekan/bundle"

          # An AppImage is read-only, so the data cannot live beside it.
          : "${WRITABLE_PATH:=${XDG_DATA_HOME:-$HOME/.local/share}/wekan}"
          export WRITABLE_PATH
          : "${PORT:=8080}"
          export PORT
          : "${ROOT_URL:=http://localhost:$PORT}"
          export ROOT_URL

          mkdir -p "$WRITABLE_PATH"

          echo "WeKan is starting."
          echo "  Open:  $ROOT_URL"
          echo "  Data:  $WRITABLE_PATH"
          echo "  Stop:  Ctrl-C"
          echo
          echo "Set WRITABLE_PATH, PORT, ROOT_URL or MONGO_URL to change any of"
          echo "this; WEKAN_DB=mongodb uses your own database instead of the"
          echo "bundled FerretDB."
          echo

          # A missing AppImage may be rebuilt around an ALREADY-PUBLISHED base
          # bundle. In that case its start-wekan.sh predates fixes in this
          # checkout. Keep the 32-bit V8 address-space ceiling in AppRun too,
          # so an i686/armhf AppImage made for an older release can start. An
          # administrator's explicit NODE_OPTIONS remains authoritative.
          case "@APPIMAGE_ARCH@" in
            i686|armhf)
              : "${NODE_OPTIONS:=--max-old-space-size=1024}"
              export NODE_OPTIONS
              ;;
          esac

          exec "$BUNDLE/start-wekan.sh" "$@"
          APPRUN
          sed -i "s/@APPIMAGE_ARCH@/$arch/" AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Pack the AppImage
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          arch='${{ matrix.appimage_arch }}'
          name="WeKan-${version}-${arch}"

          curl -fSL --retry 5 --retry-delay 10 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x appimagetool

          mkdir -p dist
          # A runner has no FUSE, so the tool cannot mount itself; this unpacks
          # it to a temporary directory and runs it from there instead.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="$arch" \
            ./appimagetool AppDir "dist/${name}.AppImage"

          chmod +x "dist/${name}.AppImage"
          # Checksum keeps the .AppImage extension in its name, matching the zip
          # convention (wekan-<v>-<arch>.zip.sha256sum) and what
          # releases/expected-assets.sh looks for. Naming it ${name}.sha256sum
          # (extension dropped) meant "what is missing" never found the checksum,
          # so every run rebuilt the AppImage even when it was already published.
          ( cd dist
            md5sum    "${name}.AppImage" > "${name}.AppImage.md5sum"
            sha256sum "${name}.AppImage" > "${name}.AppImage.sha256sum" )
          ls -lh dist

      - name: Check that it starts
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          app="dist/WeKan-${version}-${{ matrix.appimage_arch }}.AppImage"
          # An AppImage that packs is not an AppImage that runs. Start it, wait
          # for WeKan to answer on its port, then stop it - so a broken bundle
          # is caught here rather than by whoever downloads it.
          export WRITABLE_PATH="$PWD/smoke-data" PORT=8080

          # A CHECK THAT CANNOT RUN IS NOT A FAILED CHECK. Probe the INNER Node,
          # not the AppImage runtime: on the arm64 runner the armhf AppImage
          # runtime itself executes, while its bundled hard-float Node cannot
          # when /lib/ld-linux-armhf.so.3 is absent. Probing the outer wrapper
          # misclassified that missing loader as an application startup bug.
          # AppDir is the exact tree just packed, so this also avoids extracting
          # the large image merely to make the capability decision.
          if ! AppDir/usr/lib/wekan/bundle/node --version >/dev/null 2>&1; then
            echo "::warning::this runner cannot execute the bundled ${{ matrix.appimage_arch }} Node binary, so the AppImage was packed but not started. It is uploaded unchecked."
            exit 0
          fi

          APPIMAGE_EXTRACT_AND_RUN=1 "$app" > smoke.log 2>&1 &
          pid=$!
          ok=false
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null "http://localhost:8080/sign-in"; then ok=true; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != true ]; then
            echo "::error::the AppImage did not answer on port 8080; its log follows"
            tail -n 100 smoke.log
            exit 1
          fi
          echo "WeKan answered on port 8080."

      - uses: actions/upload-artifact@v7
        if: ${{ env.BUILD_THIS == 'true' }}
        with:
          name: appimage-${{ matrix.appimage_arch }}
          path: dist/
          if-no-files-found: error

  publish:
    timeout-minutes: 30
    name: attach to the release
    needs: [release, build]
    if: ${{ !cancelled() && inputs.publish != false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          path: assets
          merge-multiple: true

      - name: Say what was built, and what was not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh assets 2>/dev/null || true
          if ls assets/*.AppImage >/dev/null 2>&1; then
            # Every architecture the matrix builds. A missing one WARNS rather
          # than fails: the 32-bit pair is allowed not to build, and an
          # architecture whose base bundle was never published has nothing to
          # wrap. What must not happen silently is one going missing unnoticed.
          for want in x86_64 aarch64 i686 armhf; do
              ls assets/*"-$want.AppImage" >/dev/null 2>&1 || \
                echo "::warning::no AppImage for $want - see that build job's log"
            done
          else
            # No AppImage was produced. That is only a FAILURE if there was a base
            # bundle to wrap: an AppImage cannot be built without one, and the
            # build jobs skip (not fail) when the base bundle is not published yet.
            published="$(gh release view --repo "${GITHUB_REPOSITORY:-wekan/wekan}" '${{ needs.release.outputs.tag }}' --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            base_present=false
            for arch in amd64 arm64 i386 armhf; do
              printf '%s\n' "$published" | grep -qx "wekan-${{ needs.release.outputs.version }}-${arch}.zip" && base_present=true
            done
            if [ "$base_present" = false ]; then
              echo "::notice::No base bundle (wekan-${{ needs.release.outputs.version }}-{amd64,arm64}.zip) is on ${{ needs.release.outputs.tag }} yet, so there is nothing to wrap - skipping. release-all.yml builds the AppImages once the base bundles are published."
              exit 0
            fi
            echo "::error::A base bundle is published but no architecture produced an AppImage - every build job failed. Their logs say why; nothing is uploaded."
            exit 1
          fi

      - name: Upload them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! ls assets/*.AppImage >/dev/null 2>&1; then
            echo "Nothing to upload (no base bundle was published to wrap)."
            exit 0
          fi
          # --repo, because this job does NOT check the repository out - it only
          # downloads artifacts - so `gh` has no git remote to infer the repo
          # from and fails with "fatal: not a git repository". Every other gh
          # call in this workflow already passes it; these two did not, so the
          # AppImages were built, smoke-tested and uploaded as artifacts, and
          # then nothing was attached to the release.
          gh release upload --repo "${GITHUB_REPOSITORY:-wekan/wekan}" '${{ needs.release.outputs.tag }}' assets/* \
            --repo "${{ github.repository }}" --clobber
          echo "Uploaded to $(gh release view --repo "${GITHUB_REPOSITORY:-wekan/wekan}" '${{ needs.release.outputs.tag }}' \
            --repo "${{ github.repository }}" --json url --jq .url)"
