name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '28 23 * * *'
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Dockerfile DOWNLOADS the prebuilt release zip that release-all.yml
      # publishes (and `exit 8`s if it is missing), so this image can only be
      # built once the release for the version pinned in the Dockerfile is up. On
      # a tag push (the tag is created early in the release, ~30 min before the
      # zips are attached), during the release window, or if the release failed,
      # the asset 404s and this job failed hard. Check first and SKIP the build
      # (a notice, green run) when the release is not published yet; the release
      # image itself is built + pushed by release-all.yml's docker job.
      - name: Is the release this Dockerfile needs published yet?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -1)"
          asset="wekan-${VERSION}-amd64.zip"
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
            echo "OK: $asset is on the v${VERSION} release; building the image."
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
            echo "::notice::$asset is not on the v${VERSION} release yet - skipping. release-all.yml builds and pushes the image once the release is published."
          fi

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        if: steps.rel.outputs.build == 'yes'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Full build provenance (SLSA), not the minimal default that BuildKit
          # attaches on its own. See release-all.yml for what it is and why the
          # manifest list gains an `unknown/unknown` entry per platform.
          provenance: mode=max
