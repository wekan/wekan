name: Push Snap to Store

# Puts the .snap files of a GitHub release on the Snap Store and RELEASES them
# to every channel: wekan and wekan-ondra, every architecture
# the release carries.
#
# WHY: release-all.yml uploads each snap as it builds it, with
# `snapcraft upload --release=...`. The store can keep a revision in
# "processing" for hours, and an upload that gives up waiting leaves the
# release to the store - the job is green either way. On v13.20 every build
# was green and the snaps were on the GitHub release, but the Snap Store kept
# the old version. This workflow finishes that from the release itself,
# without building anything: releases/snap-store-push.sh releases a revision
# the store already has, uploads one it has not, waits for one still
# processing, and FAILS - red, not green - when a snap still did not reach a
# channel.
#
# "Release All Platforms" calls it as its last snap job, for the tag it just
# released (its snap-store job), and it runs by hand from the Actions tab for
# any release, snap names and channels. It used to run on workflow_run after
# every Release All run and take "the latest release" - which, for a run that
# finished before its release was published, was the previous one (v13.20).
#
# Secrets: SNAP_AUTH, as for release-all.yml - an exported login carrying
# package_access, package_push, package_release and package_update for all
# three names.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v13.20). Empty: the latest release.'
        required: false
        default: ''
      snaps:
        description: 'Snap names, space separated'
        required: false
        default: 'wekan wekan-ondra'
      channels:
        description: 'Channels to release to'
        required: false
        default: 'stable,candidate,beta,edge'
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      snaps:
        type: string
        required: false
        default: 'wekan wekan-ondra'
      channels:
        type: string
        required: false
        default: 'stable,candidate,beta,edge'
    secrets:
      SNAP_AUTH:
        required: true

permissions:
  contents: read

concurrency:
  group: snap-store
  cancel-in-progress: false

env:
  DO_NOT_TRACK: 1

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      snaps: ${{ steps.plan.outputs.snaps }}
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - name: Which release, which snaps, which channels
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SNAPS: ${{ inputs.snaps }}
          INPUT_CHANNELS: ${{ inputs.channels }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          case "$tag" in v[0-9]*) ;; *) echo "::error::'$tag' is not a release tag like v13.20."; exit 1 ;; esac
          snaps="${INPUT_SNAPS:-wekan wekan-ondra}"
          for s in $snaps; do
            case "$s" in wekan|wekan-ondra) ;; *) echo "::error::'$s' is not one of WeKan's snaps (wekan, wekan-ondra). wekan-gantt-gpl is no longer published: its users moved to the official wekan snap."; exit 1 ;; esac
          done
          channels="${INPUT_CHANNELS:-stable,candidate,beta,edge}"
          case "$channels" in *[!a-z0-9/,.-]*) echo "::error::'$channels' is not a channel list."; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "snaps=$(printf '%s\n' $snaps | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
          echo "Release $tag: $snaps -> $channels"

  push:
    needs: [plan]
    runs-on: ubuntu-24.04
    # One snap name per job; its architectures one after another. A store
    # still processing may take the whole wait of snap-store-push.sh.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.plan.outputs.snaps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: releases
          persist-credentials: false
      - name: Install snapcraft and check SNAP_AUTH
        id: snapcraft
        env:
          SNAP_AUTH: ${{ secrets.SNAP_AUTH }}
        run: |
          set -euo pipefail
          if [ -z "${SNAP_AUTH:-}" ]; then
            echo "::error::SNAP_AUTH is not set. snapcraft export-login --snaps wekan,wekan-ondra --acls package_access,package_push,package_release,package_update snap-auth.txt && gh secret set SNAP_AUTH --repo wekan/wekan < snap-auth.txt"
            exit 1
          fi
          installed=""
          for i in 1 2 3 4 5; do
            if timeout 180 sudo snap install snapcraft --classic; then installed=1; break; fi
            sudo snap abort --last=install >/dev/null 2>&1 || true
            echo "snapcraft install attempt $i/5 failed; retrying in 30s..."
            sleep 30
          done
          [ -n "$installed" ] || { echo "::error::snapcraft could not be installed: the Snap Store did not answer. Re-run the job."; exit 1; }
          SNAPCRAFT_STORE_CREDENTIALS="$SNAP_AUTH" snapcraft whoami
      - name: Download ${{ matrix.snap }} from ${{ needs.plan.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SNAP: ${{ matrix.snap }}
        run: |
          set -euo pipefail
          mkdir -p snaps
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir snaps --pattern "${SNAP}_*.snap" || true
          case "$SNAP" in
            wekan-ondra) title='Wekan Ondra' ;;
            *) title='' ;;
          esac
          if [ -z "$title" ]; then
            if ! ls snaps/"${SNAP}"_*.snap >/dev/null 2>&1; then
              echo "::error::Release $TAG has no ${SNAP}_*.snap to push: its snap job did not attach one (snap-native and snap-launchpad attach wekan). Re-run that job of the release, or Release All Missing, then this workflow."
              exit 1
            fi
          else
            # A variant IS wekan with another name and title, so one the release
            # lacks is made from the release's wekan snap of that architecture
            # (releases/snap-rename.sh), as Release All Missing does. Per
            # ARCHITECTURE, not only when the release has none at all: a release
            # with the amd64 and arm64 variants snap-variants builds, but not the
            # ppc64el, s390x, riscv64 or armhf ones, used to push those two and
            # leave every other architecture of the variant behind.
            mkdir -p wekan-snaps
            if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir wekan-snaps --pattern "wekan_*.snap"; then
              if ! ls snaps/"${SNAP}"_*.snap >/dev/null 2>&1; then
                echo "::error::Release $TAG has neither ${SNAP}_*.snap nor a wekan_*.snap to make it from. Re-run the release's snap jobs, or Release All Missing, then this workflow."
                exit 1
              fi
            fi
            for f in wekan-snaps/wekan_*.snap; do
              [ -e "$f" ] || continue
              rest="$(basename "$f")"; rest="${rest#wekan_}"
              [ -e "snaps/${SNAP}_${rest}" ] && continue
              command -v unsquashfs >/dev/null 2>&1 || sudo apt-get install -y squashfs-tools >/dev/null
              bash releases/snap-rename.sh "$f" "$SNAP" "$title" snaps
              echo "::notice::$TAG had no ${SNAP}_${rest}; made it from the release's wekan snap."
            done
          fi
          ls -l snaps
      - name: Push ${{ matrix.snap }} to the Snap Store, releasing to ${{ needs.plan.outputs.channels }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_AUTH }}
          CHANNELS: ${{ needs.plan.outputs.channels }}
        run: |
          set -euo pipefail
          failed=""
          for f in snaps/*.snap; do
            # Each architecture on its own: one that the store is still
            # processing does not stop the others.
            if ! bash releases/snap-store-push.sh "$f" "$CHANNELS"; then failed="$failed $(basename "$f")"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Not released:$failed. The ::error:: lines above say why."
            exit 1
          fi
      # The newest revision the store has of each architecture, released to
      # every channel too - one that reached the store some other way, or a
      # reviewer approved later, whatever this release's files are. always():
      # also when a file above was not taken.
      - name: Release the newest ${{ matrix.snap }} revisions the store has to ${{ needs.plan.outputs.channels }}
        if: ${{ always() && steps.snapcraft.outcome == 'success' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_AUTH }}
          CHANNELS: ${{ needs.plan.outputs.channels }}
          SNAP: ${{ matrix.snap }}
        run: bash releases/snap-store-release-newest.sh "$SNAP" "$CHANNELS"
      # "What's new in WeKan v<version>" - the release's In short paragraph
      # from CHANGELOG-big.md - on the snap's Snap Store page. The store has no
      # API for a revision's own changelog (the dashboard's "Add changelog" is a
      # web form only), so it goes on the listing: releases/snap-listing.mjs
      # writes the text and releases/snap-listing-update.sh sends it with
      # `snapcraft upload-metadata`, the store's title, summary, license and
      # icon kept as they are. Only for the NEWEST release: run for an older
      # tag, this workflow would put that older What's new back on the page.
      # continue-on-error: the snaps are released by now; a page that kept the
      # previous text is an ::error:: to read, not a release to redo.
      - name: Show what is new in ${{ needs.plan.outputs.tag }} on the ${{ matrix.snap }} Snap Store page
        if: ${{ always() && steps.snapcraft.outcome == 'success' }}
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_AUTH }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SNAP: ${{ matrix.snap }}
        run: |
          set -euo pipefail
          newest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest release ($newest): the $SNAP page keeps the newest one's What's new."
            exit 0
          fi
          command -v mksquashfs >/dev/null 2>&1 || sudo apt-get install -y squashfs-tools >/dev/null
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/CHANGELOG-big.md?ref=$TAG" > changelog-big.md
          bash releases/snap-listing-update.sh "$SNAP" "${TAG#v}" changelog-big.md
