name: Release Charts

on:
  push:
    branches:
      - main
    # This repository has no charts/ directory: the Helm chart is published to
    # wekan/charts by release-all.yml. Without this filter every push to main
    # cloned the full history (447 MB) to find no chart to release.
    paths:
      - 'charts/**'

permissions:
  contents: read

jobs:
  release:
    timeout-minutes: 30
    permissions:
      contents: write  # for helm/chart-releaser-action to push chart release and create a release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
