  /api/boards/{board}/calendar.ics:
    get:
      operationId: exportCalendarIcs
      summary: Subscribable iCalendar (.ics) feed of a board's card dates.
      description: |
        Answers GitHub issue #2836 ("CalDAV or iCal Support") - #808
         added the in-app Calendar VIEW, this is the separate EXPORT/subscribe
         feed the issue actually asked for. One VEVENT per Received / Start-End
         span / Due date a card has, the same four dates the Calendar view (#808)
         draws (see models/lib/calendarFilter.js and models/lib/icalExport.js).
         This is one-way and read-only: paste the URL into a calendar app's
         "subscribe to URL" feature. Full two-way CalDAV sync is a much larger,
         separate, stateful sync protocol and is out of scope.
      tags:
        - Boards
      parameters:
        - name: board
          in: path
          description: |
            the ID of the board whose card dates to export
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
  /api/boards/{board}/cardFieldOrder:
    get:
      operationId: get_board_card_field_order
      summary: Get the order of the opened card's sections
      description: |
        The Board Settings "card field order": the sequence in which
         the opened card draws its Labels, Dates, Members, Custom Fields and
         Description sections. Always returns every one of the five keys exactly
         once, in effect - a board that never changed the setting gets the default
         `labels, dates, members, customFields, description`. Requires board access.
      tags:
        - Boards
        - Boards
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: {cardFieldOrder: [string], keys: [string]}
    put:
      operationId: update_board_card_field_order
      summary: Set the order of the opened card's sections
      description: |
        Stores a new card field order for the board. The order is
         normalised the way the card renders it: unknown keys are dropped,
         duplicates keep their first position, and any of the five keys left out is
         appended in its default position - so the card always draws every section
         exactly once. Requires the caller to be a board admin (or site admin).
         Returns the order in effect.
      tags:
        - Boards
        - Boards
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: {cardFieldOrder: [string], keys: [string]}
  /api/boards/{board}/cardSettings:
    get:
      operationId: get_board_card_settings
      summary: Get the Board Settings / Card Settings of a board
      description: |
        The card feature toggles of Board Settings / Card Settings -
         which card fields and features this board offers (`allowsDescriptionTitle`,
         `allowsLabels`, `allowsChecklists`, `allowsAttachments`, `allowsComments`,
         `allowsActivities`, …, each `true`/`false`) - and the three card-aging day
         thresholds (`cardAgingDays1`..`cardAgingDays3`). Requires board access.
      tags:
        - Boards
        - Boards
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              allowsDescriptionTitle:
                type: boolean
              allowsLabels:
                type: boolean
              allowsChecklists:
                type: boolean
              allowsAttachments:
                type: boolean
              allowsComments:
                type: boolean
              allowsActivities:
                type: boolean
              cardAgingDays1:
                type: number
              cardAgingDays2:
                type: number
              cardAgingDays3:
                type: number
    put:
      operationId: update_board_card_settings
      summary: Set the Board Settings / Card Settings of a board
      description: |
        Sets any subset of the card feature toggles (any `allows*`
         key of the board, as `true`/`false`) and of the card-aging thresholds
         (`cardAgingDays1`..`cardAgingDays3`, non-negative integers). Keys not in
         the body are left as they are; a body with no recognised key is a 400.
         Requires board write access. Returns the settings in effect, in the same
         shape as GET.
      tags:
        - Boards
        - Boards
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: key
          in: formData
          description: the key value
          type: string
          required: true
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              allowsDescriptionTitle:
                type: boolean
              allowsLabels:
                type: boolean
              allowsChecklists:
                type: boolean
              allowsAttachments:
                type: boolean
              allowsComments:
                type: boolean
              allowsActivities:
                type: boolean
              cardAgingDays1:
                type: number
              cardAgingDays2:
                type: number
              cardAgingDays3:
                type: number
