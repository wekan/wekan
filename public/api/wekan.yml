                action:
                  type: object
    post:
      operationId: new_board_rule
      summary: Add an automation rule to a board
      description: |
        The trigger and action are embedded inline. See the Rules
         documentation for the available trigger activityTypes and action actionTypes.
         Trigger matching fields that are omitted (e.g. userId, listName,
         swimlaneName, cardTitle) default to the '*' wildcard, so e.g. issue #2674's
         "remove a member when a card is moved away from a list" only needs
         trigger {activityType: 'moveCard', oldListName: '...'} and
         action {actionType: 'removeMember', username: '...'}.
      tags:
        - Rules
        - Rules
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: title
          in: formData
          description: |
            the rule title
          type: string
          required: true
        - name: trigger
          in: formData
          description: |
            the trigger document (must include activityType)
          type: string
          format: json
          required: true
        - name: action
          in: formData
          description: |
            the action document (must include actionType)
          type: string
          format: json
          required: true
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              _id:
                type: string
              triggerId:
                type: string
              actionId:
                type: string
