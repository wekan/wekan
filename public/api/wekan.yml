swagger: '2.0'
info:
  title: Wekan REST API
  version: v11.72
  description: |
    The REST API allows you to control and extend Wekan with ease.

    If you are an end-user and not a dev or a tester, [create an issue](https://github.com/wekan/wekan/issues/new) to request new APIs.

    > All API calls in the documentation are made using `curl`.  However, you are free to use Java / Python / PHP / Golang / Ruby / Swift / Objective-C / Rust / Scala / C# or any other programming languages.

    # Production Security Concerns
    When calling a production Wekan server, ensure it is running via HTTPS and has a valid SSL Certificate. The login method requires you to post your username and password in plaintext, which is why we highly suggest only calling the REST login api over HTTPS. Also, few things to note:

    * Only call via HTTPS
    * Implement a timed authorization token expiration strategy
    * Ensure the calling user only has permissions for what they are calling and no more

schemes:
  - http

securityDefinitions:
  UserSecurity:
    type: apiKey
    in: header
    name: Authorization

paths:
  /users/login:
    post:
      operationId: login
      summary: Login with REST API
      consumes:
        - application/json
        - application/x-www-form-urlencoded
      tags:
        - Login
      parameters:
        - name: loginRequest
          in: body
          required: true
          description: Login credentials
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                description: |
                  Your username
                type: string
              password:
                description: |
                  Your password
                type: string
                format: password
      responses:
        200:
          description: |-
            Successful authentication
          schema:
            type: object
            required:
              - id
              - token
              - tokenExpires
            properties:
              id:
                type: string
                description: User ID
              token:
                type: string
                description: |
                  Authentication token
              tokenExpires:
                type: string
                format: date-time
                description: |
                  Token expiration date
        400:
          description: |
            Error in authentication
          schema:
            type: object
            properties:
              error:
                type: string
              reason:
                type: string
        default:
          description: |
            Error in authentication
  /users/register:
    post:
      operationId: register
      summary: Register with REST API
      description: |
        Notes:
          - You will need to provide the token for any of the authenticated methods.
      consumes:
        - application/x-www-form-urlencoded
        - application/json
      tags:
        - Login
      parameters:
        - name: username
          in: formData
          required: true
          description: |
            Your username
          type: string
        - name: password
          in: formData
          required: true
          description: |
            Your password
          type: string
          format: password
        - name: email
          in: formData
          required: true
          description: |
            Your email
          type: string
      responses:
        200:
          description: |-
            Successful registration
          schema:
            items:
              properties:
                id:
                  type: string
                token:
                  type: string
                tokenExpires:
                  type: string
        400:
          description: |
            Error in registration
          schema:
            items:
              properties:
                error:
                  type: number
                reason:
                  type: string
        default:
          description: |
            Error in registration

  /api/admin/attachment-settings:
    get:
      operationId: get_attachment_settings
      summary: Get the attachment storage / upload-block settings (GlobalAdmin)
      description: |
        Only the global admin can call this. Returns the Admin Panel >
         Attachments settings document, including `limitSettings.attachmentsUploadBlocked`
         and `limitSettings.avatarsUploadBlocked` plus the size limits. Cloud-storage
         secret keys (S3 secretAccessKey, Azure accountKey/connectionString, GCS
         credentials) are masked and never returned; a boolean `<field>Set` marker
         shows whether a value exists.
      tags:
        - AttachmentStorageSettings
        - Settings
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: Object
    put:
      operationId: update_attachment_settings
      summary: Update the attachment storage / upload-block settings (GlobalAdmin)
      description: |
        Only the global admin can call this. The request body is a
         partial settings object (for example
         `{"limitSettings": {"avatarsUploadBlocked": true}}`). It is applied through
         the same update path as the `updateAttachmentStorageSettings` Meteor method,
         so validation and `$set` semantics are identical: cloud-storage secrets left
         blank are preserved. The masked, updated settings document is returned.
      tags:
        - AttachmentStorageSettings
        - Settings
      consumes:
        - multipart/form-data
        - application/json
      parameters:
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: Object
  /api/admin/domains:
    get:
      operationId: get_admin_domains
      summary: List email domains with their user counts (GlobalAdmin)
      description: |
        Only the global admin can call this. Counts every user by the
         domain part of their primary email address (the first address in `emails`),
         mirroring the Admin Panel > People domain grouping. Domains are returned
         sorted by descending count, then alphabetically.
      tags:
        - Users
        - Users
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: array
            items:
              type: object
              properties:
                domain:
                  type: string
                count:
                  type: number
  /api/admin/oauth-providers:
    get:
      operationId: get_oauth_provider_settings
      summary: Get the OAuth login provider and passwordless settings
      description: |
        The Admin Panel / People / Login section for Meteor's own
         accounts-* login services (Google, GitHub, Facebook, X/Twitter, Meteor
         Developer, Weibo, Meetup) and passwordless email codes. For every provider
         field, the shared login style, the merge switch and passwordless it reports
         which source is in effect - `env` (the `OAUTH_*` / `PASSWORDLESS_ENABLED`
         environment variable), `admin` (a value saved in the Admin Panel) or
         `unset` - and the resolved value. A provider's secret is reported ONLY as
         `{ source, hasValue }`; its value is never returned. Only the global admin
         can call this.
      tags:
        - Settings
        - Settings
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              providers:
                type: object
              loginStyle:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
              mergeExistingUsers:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
              passwordless:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
  /api/admin/oauth-providers/{providerKey}:
    put:
      operationId: update_oauth_provider_settings
      summary: Update one OAuth login provider's Admin Panel settings
      description: |
        The same save the Admin Panel makes: `enabled` and `id` are
         stored as given, `secret` only when non-empty (an empty or missing secret
         leaves the stored one untouched), and `loginStyle` must be `popup` or
         `redirect` (anything else clears the per-provider override). The two
         settings shared by every provider, `globalLoginStyle` and
         `mergeExistingUsers`, may ride along. A value saved here wins over the
         environment variable, and the provider is reconfigured at once, without a
         restart. The response is the same source report as
         get_oauth_provider_settings and never contains a secret. Only the global
         admin can call this.
      tags:
        - Settings
        - Settings
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: providerKey
          in: path
          description: |
            one of google, github, facebook, twitter, meteor-developer, weibo, meetup
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              providers:
                type: object
              loginStyle:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
              mergeExistingUsers:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
              passwordless:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
  /api/admin/orgs:
    get:
      operationId: get_admin_orgs
      summary: List organizations with their feature toggles (GlobalAdmin)
      description: |
        Only the global admin can call this. Returns every organization
         with its identifying fields and the per-org feature toggles shown as columns
         in Admin Panel > People > Organizations.
      tags:
        - Org
        - Organizations
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: array
            items:
              type: object
              properties:
                _id:
                  type: string
                orgDisplayName:
                  type: string
                orgShortName:
                  type: string
                orgSharedTemplates:
                  type: boolean
                orgPropagateMembersToBoards:
                  type: boolean
                orgSyncMembersFromAuth:
                  type: boolean
  /api/admin/orgs/{org}/features:
    put:
      operationId: update_admin_org_features
      summary: Set feature toggles on one organization (GlobalAdmin)
      description: |
        Only the global admin can call this. The request body may
         contain any of `orgSharedTemplates`, `orgPropagateMembersToBoards` and
         `orgSyncMembersFromAuth` (booleans); only those whitelisted fields are
         `$set` on the organization. Returns the updated organization.
      tags:
        - Org
        - Organizations
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: org
          in: path
          description: |
            the ID of the organization
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: Object
  /api/admin/orgs/features:
    put:
      operationId: update_all_admin_org_features
      summary: Set one feature toggle on all organizations (GlobalAdmin)
      description: |
        Only the global admin can call this. The request body is
         `{ field, value }` where `field` is one of `orgSharedTemplates`,
         `orgPropagateMembersToBoards` or `orgSyncMembersFromAuth` and `value` is a
         boolean. The field is `$set` on ALL organizations. Returns the number of
         organizations updated.
      tags:
        - Org
        - Organizations
      consumes:
        - multipart/form-data
        - application/json
      parameters:
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              updated:
                type: number
  /api/admin/passwordless:
    put:
      operationId: update_passwordless_settings
      summary: Turn passwordless (email sign-in code) login on or off
      description: |
        The Admin Panel override of `PASSWORDLESS_ENABLED`. While it
         is off, the sign-in-code form is not shown and the token request and the
         login attempt are both refused, so the package can neither create accounts
         nor send codes. Takes effect at once, without a restart. Only the global
         admin can call this.
      tags:
        - Settings
        - Settings
      consumes:
        - multipart/form-data
        - application/json
      parameters:
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              passwordless:
                type: object
                properties:
                  source:
                    type: string
                  value:
                    type: string
  /api/admin/problems:
    get:
      operationId: get_admin_problems
      summary: Get the Admin Panel / Problems status overview
      description: |
        What Admin Panel / Problems / Summary shows: every migration or
         repair in progress, the detected problems (broken cards, lists missing their
         swimlane, failing login-page checks), and for each event stream (`security`,
         `speed`, `tests`, `cpu`, `database`, `integrity`) how many problems are newer
         than its acknowledgment. The same overview `snap run wekan.problems` prints.
         Only the global admin can call this.
      tags:
        - EventLog
        - Problems
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: {inProgress: [{kind: string, active: boolean, message: string}], problems: [{id: string, severity: string, title: string, detail: string, count: number}], newProblems: [{stream: string, count: number}], streams: [string]}
  /api/admin/problems/{stream}:
    get:
      operationId: get_admin_problem_stream
      summary: Get one page of an Admin Panel / Problems event stream
      description: |
        One page of a stream's rows, newest first (the `api` usage
         stream sorts by count): `security` (Security Report), `speed`, `tests`,
         `cpu`, `database` (restarts, storage and disk-space findings, indexes
         created), `integrity` and `api`. Each row is a SUMMARY that accumulates -
         `count`, `firstAt`..`at`, `actors` - never a row per event. Only the global
         admin can call this.
      tags:
        - EventLog
        - Problems
      parameters:
        - name: stream
          in: path
          description: |
            the stream name: security, speed, tests, cpu, database, integrity or api
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: {stream: string, total: number, limit: number, skip: number, rows: [object]}
  /api/admin/problems/{stream}/acknowledge:
    post:
      operationId: acknowledge_admin_problem_stream
      summary: Acknowledge the new problems of an event stream
      description: |
        Marks everything currently in the stream as seen, the way the
         Admin Panel's acknowledge button does, so `get_admin_problems` reports zero
         new problems for it until the next one is recorded. Only the global admin
         can call this.
      tags:
        - EventLog
        - Problems
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: stream
          in: path
          description: |
            the stream name: security, speed, tests, cpu, database or integrity
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              acknowledged:
                type: string
  /api/admin/teams:
    get:
      operationId: get_admin_teams
      summary: List teams with their feature toggles (GlobalAdmin)
      description: |
        Only the global admin can call this. Returns every team with
         its identifying fields and the per-team feature toggles shown as columns in
         Admin Panel > People > Teams.
      tags:
        - Team
        - Teams
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: array
            items:
              type: object
              properties:
                _id:
                  type: string
                teamDisplayName:
                  type: string
                teamShortName:
                  type: string
                teamSharedTemplates:
                  type: boolean
                teamPropagateMembersToBoards:
                  type: boolean
                teamSyncMembersFromAuth:
                  type: boolean
  /api/admin/teams/{team}/features:
    put:
      operationId: update_admin_team_features
      summary: Set feature toggles on one team (GlobalAdmin)
      description: |
        Only the global admin can call this. The request body may
         contain any of `teamSharedTemplates`, `teamPropagateMembersToBoards` and
         `teamSyncMembersFromAuth` (booleans); only those whitelisted fields are
         `$set` on the team. Returns the updated team.
      tags:
        - Team
        - Teams
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: team
          in: path
          description: |
            the ID of the team
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: Object
  /api/admin/teams/features:
    put:
      operationId: update_all_admin_team_features
      summary: Set one feature toggle on all teams (GlobalAdmin)
      description: |
        Only the global admin can call this. The request body is
         `{ field, value }` where `field` is one of `teamSharedTemplates`,
         `teamPropagateMembersToBoards` or `teamSyncMembersFromAuth` and `value` is a
         boolean. The field is `$set` on ALL teams. Returns the number of teams
         updated.
      tags:
        - Team
        - Teams
      consumes:
        - multipart/form-data
        - application/json
      parameters:
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              updated:
                type: number
  /api/boards:
    get:
      operationId: get_boards
      tags:
        - Boards
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
    post:
      operationId: post_boards
      tags:
        - Boards
      consumes:
        - multipart/form-data
        - application/json
      parameters:
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
  /api/boards/{board}:
    get:
      operationId: get_board
      tags:
        - Boards
      parameters:
        - name: board
          in: path
          description: the board value
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
    delete:
      operationId: delete_board
      tags:
        - Boards
      parameters:
        - name: board
          in: path
          description: the board value
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
  /api/boards/{board}/attachments:
    get:
      operationId: get_board_attachments
      tags:
        - Boards
      parameters:
        - name: board
          in: path
          description: the board value
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
  /api/boards/{board}/attachments/{attachment}:
    delete:
      operationId: delete_board_attachment
      summary: Soft-delete an attachment
      description: |
        The same "Delete" the card offers: the attachment gets
         `deletedAt`, `deletedBy` and `deleteBatchId`, its file is kept, the card and
         the minicard badge hide it, its cover is unset if it was the card's cover,
         and the card history records who deleted it. Restore it with
         `POST /api/boards/:boardId/attachments/:attachmentId/restore`. There is no
         hard delete of a single attachment over the API. Requires permission to
         edit the card the attachment is on (or write access to the board for a
         board-level attachment). Idempotent: an already-deleted attachment is left
         as it is.
      tags:
        - Attachments
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
        - name: attachment
          in: path
          description: |
            the attachment ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              deleted:
                type: boolean
              batchId:
                type: string
  /api/boards/{board}/attachments/{attachment}/export:
    get:
      operationId: exportJson
      summary: This route is used to export a attachement to a json file format.
      description: |
        If user is already logged-in, pass loginToken as param
         "authToken": '/api/boards/:boardId/attachments/:attachmentId/export?authToken=:token'
      tags:
        - Boards
      parameters:
        - name: board
          in: path
          description: |
            the ID of the board we are exporting
          type: string
          required: true
        - name: attachment
          in: path
          description: |
            the ID of the attachment we are exporting
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
  /api/boards/{board}/attachments/{attachment}/restore:
    post:
      operationId: restore_board_attachment
      summary: Restore a soft-deleted attachment
      description: |
        The card history's Restore for an attachment row: clears the
         delete mark so the card, its attachment count and the minicard badge include
         the attachment again, and records the restore in the card history. The
         cover is never re-set by a restore. Requires the same permission as
         deleting. Idempotent: `restored` is false for an attachment that is not
         deleted.
      tags:
        - Attachments
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
        - name: attachment
          in: path
          description: |
            the attachment ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
              restored:
                type: boolean
  /api/boards/{board}/attachments/deleted:
    get:
      operationId: get_board_deleted_attachments
      summary: Get the soft-deleted attachments of a board
      description: |
        Deleting an attachment from a card is a soft delete: the file
         is kept, the card hides it, and the card history can restore it. This lists
         the attachments of a board that are currently deleted, with who deleted each
         and when, so a script can find one to restore. The live attachments are at
         `GET /api/boards/:boardId/attachments`. Requires board access.
      tags:
        - Attachments
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: array
            items:
              type: object
              properties:
                attachmentId:
                  type: string
                attachmentName:
                  type: string
                attachmentType:
                  type: string
                boardId:
                  type: string
                swimlaneId:
                  type: string
                listId:
                  type: string
                cardId:
                  type: string
                deletedAt:
                  type: string
                deletedBy:
                  type: string
                deleteBatchId:
                  type: string
  /api/boards/{board}/boardViewSettings:
    get:
      operationId: get_board_view_settings
      summary: Get the Board Settings / Board View of a board
      description: |
        Which entries of the Board View menu this board offers and
         which one it opens in, separately for when the board is public and when it
         is private, and the order the menu lists them in. `boardViewSettings` has
         every view key exactly once with both `showOnPublic` and `showOnPrivate`
         made explicit (a board that never opened the popup shows every view), the
         two defaults are resolved (missing or unknown reads as
         `board-view-swimlanes`), and `boardViewOrder` is made whole: every view
         exactly once, unknown keys dropped, missing ones appended in default order.
         `keys` lists the known view keys. Requires board access.
      tags:
        - Boards
        - Boards
      parameters:
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: {boardViewSettings: object, defaultPublicBoardView: string, defaultPrivateBoardView: string, boardViewOrder: [string], keys: [string]}
    put:
      operationId: update_board_view_settings
      summary: Set the Board Settings / Board View of a board
      description: |
        Sets any subset of `boardViewSettings` (an object of
         `"<view>": { showOnPublic, showOnPrivate }`, each side optional),
         `defaultPublicBoardView`, `defaultPrivateBoardView` and `boardViewOrder`
         (an array of view keys), with the rules the Board View popup applies: a
         default is always shown on its side (setting a default also shows it, and
         hiding a side's current default is refused with 400 - set another default
         first), an unknown view key anywhere in the body is a 400, and the order is
         normalised so the menu lists every view exactly once. Defaults are applied
         before the show flags, so one request can move the default and hide the
         old one. Requires the caller to be a board admin (or site admin). Returns
         the settings in effect, in the same shape as GET.
      tags:
        - Boards
        - Boards
      consumes:
