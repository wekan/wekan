    type: object
    properties:
      domain:
        description: |
           The email-address domain, e.g. example.com
        type: string
      isActive:
        description: |
           Is the domain share active?
        type: boolean
    required:
      - domain
      - isActive
  BoardsWiplimitgroups:
    type: object
    properties:
      _id:
        description: |
           Unique id of a WIP limit group.
        type: string
      name:
        description: |
           Optional display name for the group (e.g. "Middle columns").
        type: string
      listIds:
        description: |
           The _ids of the board's lists that share this group's limit. At least
           two - a "group" of one is just that list's own individual wipLimit.
        type: array
        items:
          type: string
      limit:
        description: |
           The combined card-count limit shared by every list in listIds.
        type: number
      enabled:
        description: |
           Whether this group's limit is currently in effect. Kept (rather than
           deleting the group) so a temporarily-disabled group's list selection
           and limit are not lost.
        type: boolean
    required:
      - _id
      - listIds
      - limit
      - enabled
  CardComments:
    type: object
    description:  A comment on a card
    properties:
      boardId:
        description: |
           the board ID
        type: string
      cardId:
        description: |
           the card ID
        type: string
      text:
        description: |
           the text of the comment
        type: string
      parentId:
        description: |
           the _id of the comment this comment is a reply to (threaded replies).
           Optional: top-level comments have no parentId.
        type: string
        x-nullable: true
      createdAt:
        description: |
           when was the comment created
        type: string
      modifiedAt:
        type: string
      userId:
        description: |
           the author ID of the comment
        type: string
    required:
      - boardId
      - cardId
      - text
      - createdAt
      - modifiedAt
      - userId
  Cards:
    type: object
    properties:
      title:
        description: |
           the title of the card
        type: string
        x-nullable: true
      archived:
        description: |
           is the card archived
        type: boolean
      archivedAt:
        description: |
           latest archiving date
        type: string
        x-nullable: true
      deletedAt:
        type: string
        x-nullable: true
      deletedBy:
        type: string
        x-nullable: true
      deleteBatchId:
        type: string
        x-nullable: true
      parentId:
        description: |
           ID of the parent card
        type: string
        x-nullable: true
      listId:
        description: |
           List ID where the card is
        type: string
        x-nullable: true
      swimlaneId:
        description: |
           Swimlane ID where the card is
        type: string
      boardId:
        description: |
           Board ID of the card
        type: string
        x-nullable: true
      coverId:
        description: |
           Cover ID of the card
        type: string
        x-nullable: true
      color:
        type: string
        x-nullable: true
      createdAt:
        description: |
           creation date
        type: string
      modifiedAt:
        type: string
      customFields:
        description: |
           list of custom fields
        type: array
        items:
          $ref: "#/definitions/CardsCustomfields"
        x-nullable: true
      recurrenceInterval:
        description: |
           Kanboard-style whole-card recurrence: automatically create a fresh copy
           of this card in the same list on a recurring schedule (e.g. a weekly
           status-report card, a monthly invoice card), so the next occurrence
           does not have to be created by hand every time. 'none' (default) never
           recurs. Reuses the exact same due-date mechanism as a checklist's
