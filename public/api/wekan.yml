    put:
      operationId: edit_board_rule
      summary: Edit an automation rule
      description: |
        Any of title, enabled, trigger and action may be supplied; the trigger
         and action documents are replaced ($set) when present. A supplied trigger
         that includes an activityType gets its missing matching fields defaulted
         to the '*' wildcard, like on creation.
      tags:
        - Rules
        - Rules
      consumes:
        - multipart/form-data
        - application/json
      parameters:
        - name: title
          in: formData
          description: |
            the new rule title
          type: string
          required: false
        - name: enabled
          in: formData
          description: |
            false pauses the rule without deleting it (its
            trigger and action stay as they are); true resumes it
          type: boolean
          required: false
        - name: trigger
          in: formData
          description: |
            the new trigger document
          type: string
          format: json
          required: false
        - name: action
          in: formData
          description: |
            the new action document
          type: string
          format: json
          required: false
        - name: board
          in: path
          description: |
            the board ID
          type: string
          required: true
        - name: rule
          in: path
          description: |
            the rule ID
          type: string
          required: true
      produces:
        - application/json
      security:
          - UserSecurity: []
      responses:
        '200':
          description: |-
            200 response
          schema:
            type: object
            properties:
