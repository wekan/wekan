# des regles plus strictes encore et Jalor ne l'embarque pas : une administration
# qui y a droit l'ajoute elle-meme via l'en-tete DSFR. Les modalites completes
# sont dans node_modules/@gouvfr/dsfr/doc/legal/cgu.md et une copie de la licence
# est vendue avec les fichiers dans public/dsfr/.
#
# Voir docs/Jalor/DSFR.md.
