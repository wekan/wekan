# Modalites d'utilisation du Systeme de Design de l'Etat (DSFR).
#
# Le paquet npm @gouvfr/dsfr refuse de s'installer tant que ce fichier ne
# declare pas la version des modalites acceptee. Ce fichier est donc la trace,
# dans le depot, de cette acceptation pour le projet Jalor.
#
# A LIRE AVANT DE DEPLOYER : le DSFR est d'usage RESTREINT. Il est destine aux
# services numeriques de l'Etat et des organismes charges d'une mission de
